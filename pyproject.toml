[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clinrag"
version = "0.1.0"
description = "Cost-aware retrieval planner for clinical RAG over MIMIC-IV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "faiss-cpu",
    # sentence-transformers 6 needs transformers 5, which needs torch 2.6+ (Sol uses 2.5.1 cu121).
    "sentence-transformers>=3,<6",
    "huggingface_hub>=0.34,<1",
    "scikit-learn",
    "scipy",
    "joblib",
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]
# transformers 5 needs torch 2.6+ and silently disables PyTorch on 2.5.1; 4.56 is the first
# release that takes the dtype= argument llama.py passes to from_pretrained.
llm = ["transformers>=4.56,<5", "accelerate", "bitsandbytes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
