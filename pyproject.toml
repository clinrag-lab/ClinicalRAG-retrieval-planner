[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clinrag"
version = "0.1.0"
description = "Cost-aware retrieval planner for clinical RAG over MIMIC-IV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "faiss-cpu",
    "sentence-transformers",
    "scikit-learn",
    "scipy",
    "joblib",
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["transformers", "accelerate", "bitsandbytes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
