# Copy to config.yaml (git-ignored) and edit paths for your machine.

# Directory holding the MIMIC-IV hosp tables (CSV or CSV.GZ).
data_dir: data/mimic-iv-demo/

# Path to the discharge notes file (MIMIC-IV-Note discharge table).
notes_path: data/mimic-iv-note/discharge.csv.gz

# Sentence embedding model for the note index.
embed_model: BAAI/bge-base-en-v1.5

# Local model used to generate answers.
llm_model: meta-llama/Llama-3.1-8B-Instruct

# Number of retrieved items passed to the LLM.
top_k: 5

# Number of candidates fetched when probing a source before filtering.
probe_k: 20

# Token weight in plan cost.
alpha: 1.0

# Planner cost model. Latencies and token averages are starting guesses;
# calibrate them on real runs.

# Search-first is only used if it needs at most this many candidates.
max_candidates: 1000

# Average tokens per relational result row and per note chunk.
avg_tokens_per_row: 20
avg_tokens_per_chunk: 256

# Estimated latency (ms) of one relational query and one graph expansion.
relational_ms: 20
graph_ms: 1

# Note search latency (ms): scoring 1000 notes, fetching and post-filtering
# 1000 candidates, and building and applying a filter over 1000 admission ids.
note_scan_ms_per_1k_notes: 0.5
note_fetch_ms_per_1k_candidates: 2.0
id_filter_ms_per_1k_ids: 1.0

# Where run outputs are written (git-ignored).
output_dir: outputs/
